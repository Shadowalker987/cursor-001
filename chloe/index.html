<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chloe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chloe-container">
        <div class="led"></div>
        <img src="chloe.jpg" alt="Chloe" class="chloe-img">

        <div class="dialogue-box">
            <p id="chloe-text">Hola, soy Chloe. ¿En qué puedo ayudarte?</p>
            <button id="speak-btn">Reproducir voz</button>

            <div class="user-input">
                <input type="text" id="user-input" placeholder="Escribe algo para que Chloe lo diga">
                <button id="send-btn">Enviar</button>
            </div>

            <button id="mic-btn">🎤 Hablar con el micrófono</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
